# Po kazdej zmianie issues przelicza postep modulow (prefiks [modul] w tytule)
# i aktualizuje tresc przypietego issue "Postęp modułów". Niczego nie commituje.
# Zmiany wykonane przez GITHUB_TOKEN nie uruchamiaja workflow ponownie (brak petli).
name: Postęp modułów

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Przelicz postęp
        run: python3 .github/scripts/update_progress.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
